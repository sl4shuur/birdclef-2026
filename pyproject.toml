[project]
name = "birdclef-2026"
version = "0.1.0"
description = "Acoustic Species Identification in the Pantanal, South America"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "scikit-learn>=1.5",
  "pydantic>=2.7",
  "pydantic-settings>=2.5",
  "rich>=13.9",
  "rich-click>=1.9.7",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
notebooks = ["ipykernel>=6", "ipywidgets>=8", "nbformat>=5", "matplotlib>=3.9"]
audio = ["soundfile>=0.13", "librosa>=0.11", "scipy>=1.14"]

deep-learning = ["torch>=2.11", "torchvision>=0.26", "lightning>=2.6", "wandb>=0.31.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef"]

[tool.uv]
default-groups = ["dev"]

# Optional Kaggle image pins go here after `wheelhouse.py snapshot`.
constraint-dependencies = [
    # BEGIN kaggle-image-pins
    # END kaggle-image-pins
]

[tool.uv.sources]
torch = { index = "pytorch-cu128"}
torchvision = { index = "pytorch-cu128"}

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "build>=1.2"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  "src/birdclef/loggers/*.py",
  "*.ipynb"
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
# "src/api/**/*.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
